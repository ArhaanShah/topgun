code_bridge: "Here is the exact custom implementation:"
code: |-
  ```cpp
  #include <cstddef>
  #include <utility>

  void quicksort(double* a, std::size_t n) {
      while (n > 1) {
          const double pivot = a[n / 2];
          std::size_t lo = 0, i = 0, hi = n;
          while (i < hi) {
              if (a[i] < pivot) {
                  std::swap(a[lo++], a[i++]);
              } else if (a[i] > pivot) {
                  std::swap(a[i], a[--hi]);
              } else {
                  ++i;
              }
          }
          if (lo < n - hi) {
              quicksort(a, lo);
              a += hi;
              n -= hi;
          } else {
              quicksort(a + hi, n - hi);
              n = lo;
          }
      }
  }
  ```
