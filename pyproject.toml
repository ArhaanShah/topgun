[project]
name = "phase-a"
version = "0.1.0"
description = "Reproducible Phase A study of benign WeirdChat behavior reproduction"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "datasets==5.0.1",
    "huggingface-hub==1.30.0",
    "packaging==26.3",
    "polars==1.44.2",
    "psutil==7.2.2",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "tqdm==4.70.0",
    "transformers==5.16.1",
    "zstandard==0.25.0",
]

[project.optional-dependencies]
gpu = [
    "torch==2.13.0; sys_platform == 'linux'",
    "vllm==0.29.0; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[project.scripts]
phase-a = "phase_a.cli:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["tests/.pytest_temp", ".phase_a_cache", ".phase_a_runs", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
